name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v0.1.0-beta.1)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            zig-target: aarch64-macos.14.0
          - os: macos-15-intel
            platform: darwin
            arch: x64
            zig-target: x86_64-macos.14.0
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            zig-target: x86_64-linux-gnu.2.35
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            zig-target: aarch64-linux-gnu.2.35
          - os: windows-2025
            platform: win32
            arch: x64
            zig-target: x86_64-windows-gnu
          - os: windows-2025
            platform: win32
            arch: arm64
            zig-target: aarch64-windows-gnu
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup dependencies
        run: |
          node scripts/setup.js

      - name: Build binaries
        if: matrix.platform != 'win32'
        run: |
          vendors/zig/zig build -Doptimize=ReleaseFast -Dcpu=baseline -Dtarget=${{ matrix.zig-target }}

      - name: Build binaries
        if: matrix.platform == 'win32'
        run: |
          vendors/zig/zig build -Doptimize=ReleaseFast -Dcpu=baseline -Dtarget=${{ matrix.zig-target }}

      - name: Validate release contract
        run: node --test scripts/release-contract.test.js

      - name: Verify macOS deployment target
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          minos="$(otool -l zig-out/bin/zig-zstd | awk '$1 == "minos" { print $2; exit }')"
          if [ "$minos" != "14.0" ]; then
            echo "zig-zstd requires macOS $minos; expected 14.0"
            exit 1
          fi

      - name: Test
        if: matrix.cross != true
        run: |
          vendors/zig/zig build test -Dtarget=${{ matrix.zig-target }}

      - name: Build ARM64 tests
        if: matrix.cross == true
        run: vendors/zig/zig build test-build -Dtarget=${{ matrix.zig-target }}

      - name: Upload ARM64 tests
        if: matrix.cross == true
        uses: actions/upload-artifact@v4
        with:
          name: arm64-tests-zig-zstd
          path: zig-out/bin/test.exe
          if-no-files-found: error

      - name: Package binaries
        run: |
          node scripts/package-binaries.js

      - name: Create tarball
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            tar -czf ../zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-zstd.exe
          else
            tar -czf ../zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-zstd
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}
          path: zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  test-windows-arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: arm64-tests-zig-zstd
          path: arm64-tests
      - uses: actions/download-artifact@v4
        with:
          name: zig-zstd-win32-arm64
          path: arm64-release
      - name: Run ARM64 tests and packaged CLI
        shell: pwsh
        run: |
          & ./arm64-tests/test.exe
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 unit tests failed' }
          tar -xzf arm64-release/zig-zstd-win32-arm64.tar.gz -C arm64-release
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 archive extraction failed' }
          node scripts/test-release-binaries.js arm64-release arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 release smoke test failed' }

  release:
    needs: [build, test-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zig-zstd-*
          path: artifacts

      - name: Publish immutable release to R2
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-r2.js --artifacts=artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.event.inputs.tag, '-beta') }}
          body: |
            zig-zstd release

            Pre-built binaries for:
            - **macOS** (arm64 & x64): `zig-zstd-darwin-[arch].tar.gz`
            - **Linux** (x64 & arm64): `zig-zstd-linux-[arch].tar.gz`
            - **Windows** (x64 & arm64): `zig-zstd-win32-[arch].tar.gz`

            ## Usage

            Download the appropriate tarball for your platform and extract:
            ```bash
            tar -xzf zig-zstd-darwin-arm64.tar.gz
            ./zig-zstd compress -i input.tar -o input.tar.zst -l 19 --progress
            ./zig-zstd decompress -i input.tar.zst -o input.tar
            ```
