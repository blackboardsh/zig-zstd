name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v0.1.0-beta.1)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup dependencies
        run: |
          node scripts/setup.js

      - name: Build binaries
        run: |
          zig build -Doptimize=ReleaseFast

      - name: Test
        run: |
          zig build test

      - name: Package binaries
        run: |
          node scripts/package-binaries.js

      - name: Create tarball
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            tar -czf ../zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-zstd.exe
          else
            tar -czf ../zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-zstd
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}
          path: zig-zstd-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.event.inputs.tag, '-beta') }}
          body: |
            zig-zstd release

            Pre-built binaries for:
            - **macOS** (arm64 & x64): `zig-zstd-darwin-[arch].tar.gz`
            - **Linux** (x64 & arm64): `zig-zstd-linux-[arch].tar.gz`
            - **Windows** (x64): `zig-zstd-win32-x64.tar.gz`

            ## Usage

            Download the appropriate tarball for your platform and extract:
            ```bash
            tar -xzf zig-zstd-darwin-arm64.tar.gz
            ./zig-zstd compress -i input.tar -o input.tar.zst -l 19 --progress
            ./zig-zstd decompress -i input.tar.zst -o input.tar
            ```
