name: Verify Published macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify (defaults to package.json)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Published release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and exercise immutable release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node scripts/verify-macos-release.js
